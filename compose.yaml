name: wander
services:
  rest:
    build: ../rest-api
    environment:
      PORT: "3000"
      APP_MODE: demo
      PROVIDER_STORE: ${PROVIDER_STORE:-memory}
      DYNAMO_TABLE: ${DYNAMO_TABLE:-}
      DYNAMO_ENDPOINT: ${DYNAMO_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CORS_ORIGIN: http://localhost:3001
      TELEMETRY_MODE: ${TELEMETRY_MODE:-off}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      retries: 12
      # Poll every second while starting so dependants are not held for a full interval.
      start_period: 20s
      start_interval: 1s
  graph:
    build: ../graph-api
    environment:
      PORT: "4000"
      APP_MODE: demo
      REST_URL: http://rest:3000
      CORS_ORIGIN: http://localhost:3001
      # Each selection defaults to the offline mock; graph validates a selection at startup
      # and exits when its key or model is missing.
      PROVIDER_WEATHER: ${PROVIDER_WEATHER:-mock}
      PROVIDER_PLACES: ${PROVIDER_PLACES:-mock}
      PROVIDER_EVENTS: ${PROVIDER_EVENTS:-mock}
      PROVIDER_LLM: ${PROVIDER_LLM:-mock}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # Per-request vendor timeout; public endpoints such as Overpass can need more than 5 s.
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-5000}
      # Keys reach this service only, under WANDER_ names, so a vendor key already exported
      # in the shell for other tools is never passed in by accident.
      TICKETMASTER_API_KEY: ${WANDER_TICKETMASTER_API_KEY:-}
      OPENAI_API_KEY: ${WANDER_OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${WANDER_ANTHROPIC_API_KEY:-}
      TELEMETRY_MODE: ${TELEMETRY_MODE:-off}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      rest:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      retries: 12
      # Poll every second while starting so dependants are not held for a full interval.
      start_period: 20s
      start_interval: 1s
  ui:
    build:
      context: ../react-ui
      args:
        NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
        UI_SITE_ORIGIN: http://localhost:3001
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_RELEASE: ${NEXT_PUBLIC_SENTRY_RELEASE:-}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      graph:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      retries: 12
      # Poll every second while starting so dependants are not held for a full interval.
      start_period: 20s
      start_interval: 1s
  # The database image runs as dynamodblocal and has no /data directory, so Docker
  # creates the volume root-owned. Hand it to the image user before the database starts.
  dynamodb-volume-init:
    image: amazon/dynamodb-local:2.6.1
    profiles: ["dynamo"]
    user: "0:0"
    entrypoint: ["chown", "-R", "dynamodblocal:dynamodblocal", "/data"]
    volumes:
      - dynamodb-data:/data
  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    profiles: ["dynamo"]
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    volumes:
      - dynamodb-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      dynamodb-volume-init:
        condition: service_completed_successfully
  dynamodb-init:
    build:
      context: ../rest-api
      target: build
    profiles: ["dynamo"]
    command: ["bun", "run", "scripts/init-dynamo.ts"]
    environment:
      PROVIDER_STORE: dynamo
      DYNAMO_TABLE: ${DYNAMO_TABLE:-wander-local}
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      dynamodb:
        condition: service_started
  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    profiles: ["telemetry"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./telemetry/collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: ["telemetry"]
    ports:
      - "127.0.0.1:16686:16686"
  collector-newrelic:
    image: otel/opentelemetry-collector-contrib:0.161.0
    profiles: ["newrelic"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./telemetry/collector-newrelic.yaml:/etc/otel/config.yaml:ro
    environment:
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_OTLP_ENDPOINT: ${NEW_RELIC_OTLP_ENDPOINT:-https://otlp.nr-data.net:4318}
volumes:
  dynamodb-data:
